<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>냥퐁! ✦ NYAN PONG ✦</title>
<style>
  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  html, body {
    width: 100%;
    min-height: 100vh;
    background: #2b1b3d;
    background: repeating-linear-gradient(45deg, #33204a 0 24px, #2b1b3d 24px 48px);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    overflow: hidden;
    touch-action: none;
    font-family: 'Courier New', monospace;
    padding: 10px;
  }

  .game-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 600px;
  }

  .crt-frame {
    position: relative;
    padding: 12px 12px 22px 12px;
    background: linear-gradient(145deg, #ffd9ec, #f7b6d5 60%, #e397bd);
    border-radius: 18px;
    box-shadow:
      0 12px 35px rgba(0,0,0,.55),
      inset 0 2px 0 rgba(255,255,255,.8),
      inset 0 -6px 12px rgba(0,0,0,.15);
    width: 100%;
    box-sizing: border-box;
  }

  .crt-frame::after {
    content: "≡ NYAN·TRON 1996 ≡";
    position: absolute;
    bottom: 3px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 2px;
    color: #a05a80;
    font-weight: bold;
    white-space: nowrap;
  }

  .screen {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: inset 0 0 30px rgba(0,0,0,.35);
    width: 100%;
    background: #ffe3f1;
    display: block;
  }

  canvas { 
    display: block; 
    width: 100%;
    height: auto;
    image-rendering: pixelated;
    touch-action: none;
    cursor: pointer;
  }

  .screen::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 3;
    background:
      repeating-linear-gradient(0deg,
        rgba(0,0,0,.1) 0px, rgba(0,0,0,.1) 1px,
        transparent 1px, transparent 3px);
  }

  .hint {
    margin-top: 12px;
    color: #ffc7e3;
    font-size: 11px;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 0 rgba(0,0,0,.4);
    text-align: center;
    line-height: 1.5;
  }
  .hint b { color: #fff0f8; }
</style>
</head>
<body>

<div class="game-container">
  <div class="crt-frame">
    <div class="screen">
      <canvas id="game" width="640" height="440"></canvas>
    </div>
  </div>
  <div class="hint">
    <b>화면 터치/드래그</b> — 고양이는 <b>반대로</b> 움직입니다 ᓚᘏᗢ<br>
    <b>화면 터치</b> 시작 · 먼저 <b>7점</b> 승리 · ⚠ 가끔 <b>쥐</b>가 지나가요!
  </div>
</div>

<script>
(() => {
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const W = 640, H = 440;

const PAL = {
  bg1: '#ffe3f1', bg2: '#ffd1e8',
  net: '#ff9ec7',
  ink: '#7c3f66',
  pink: '#ff8fbf',
  cream: '#fff7ef',
  mint: '#bdeee2',
  yarn: '#ff6f9c',
  yarnLine: '#e04f7e',
  shadow: 'rgba(124,63,102,.18)',
};

let AC = null;
function getAudio() {
  try {
    if (!AC) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) AC = new AudioCtx();
    }
    if (AC && AC.state === 'suspended') {
      AC.resume();
    }
  } catch(e) {}
  return AC;
}

function bleep(freq, dur, type, vol, slide) {
  dur = dur || 0.07;
  type = type || 'square';
  vol = vol || 0.12;
  slide = slide || 0;
  try {
    const ac = getAudio();
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, ac.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), ac.currentTime + dur);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.connect(g);
    g.connect(ac.destination);
    o.start();
    o.stop(ac.currentTime + dur);
  } catch(e) {}
}

function meow() {
  bleep(760, 0.16, 'triangle', 0.18, -320);
  setTimeout(() => bleep(560, 0.22, 'triangle', 0.16, -260), 110);
}

const S = { TITLE: 0, PLAY: 1, SCORE_PAUSE: 2, OVER: 3 };
let state = S.TITLE;
let t = 0;

const WIN_SCORE = 7;
const PADDLE_H = 78, PADDLE_W = 26;

const player = { x: 26, y: H/2 - PADDLE_H/2, score: 0, blink: 0, scoredLast: false };
const cpu    = { x: W - 26 - PADDLE_W, y: H/2 - PADDLE_H/2, score: 0, blink: 0 };
const ball   = { x: W/2, y: H/2, vx: 0, vy: 0, r: 9, spin: 0, squish: 0 };

let hearts = [];
let floaters = [];
let bgPaws = [];
let shake = 0;
let winner = null;
let scorePauseT = 0;
let celebrate = null;
let nextRatIn = 60 * 6;

const rat = { active: false, x: 0, y: 0, vx: 0, wave: 0 };

for (let i = 0; i < 7; i++) {
  bgPaws.push({
    x: 60 + Math.random() * (W - 120),
    y: 40 + Math.random() * (H - 80),
    a: Math.random() * Math.PI * 2,
    s: 0.7 + Math.random() * 0.6
  });
}

function serveBall(dir) {
  ball.x = W / 2;
  ball.y = H / 2;
  const ang = (Math.random() * 0.6 - 0.3);
  const sp = 4.6;
  ball.vx = Math.cos(ang) * sp * dir;
  ball.vy = Math.sin(ang) * sp;
  ball.spin = 0;
}

function resetMatch() {
  player.score = 0;
  cpu.score = 0;
  player.scoredLast = false;
  winner = null;
  celebrate = null;
  rat.active = false;
  nextRatIn = 60 * (4 + Math.random() * 4);
  serveBall(Math.random() < 0.5 ? 1 : -1);
}

let targetY = null;

function updatePointerY(clientY) {
  const r = cvs.getBoundingClientRect();
  if (!r.height) return;
  const rawY = (clientY - r.top) * (H / r.height);
  targetY = H - rawY; // Reverse cat controls
}

function handleStart() {
  getAudio();
  if (state === S.TITLE) {
    resetMatch();
    state = S.PLAY;
    bleep(880, 0.1, 'square', 0.12, 200);
  } else if (state === S.OVER) {
    state = S.TITLE;
    bleep(660, 0.08);
  }
}

cvs.addEventListener('touchstart', e => {
  e.preventDefault();
  handleStart();
  if (e.touches && e.touches[0]) updatePointerY(e.touches[0].clientY);
}, { passive: false });

cvs.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches && e.touches[0]) updatePointerY(e.touches[0].clientY);
}, { passive: false });

cvs.addEventListener('mousemove', e => updatePointerY(e.clientY));
cvs.addEventListener('click', handleStart);

addEventListener('keydown', e => {
  getAudio();
  if (e.key === ' ') {
    e.preventDefault();
    handleStart();
  }
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') player.y += 20;
  if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') player.y -= 20;
});

function burstHearts(x, y, n, spread) {
  spread = spread || 2.4;
  for (let i = 0; i < n; i++) {
    hearts.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * spread * 2,
      vy: -Math.random() * spread - 1,
      life: 1,
      s: 5 + Math.random() * 5,
      hue: Math.random() < 0.5 ? '#ff6f9c' : '#ffa3c4'
    });
  }
}

function floatText(x, y, txt, color) {
  floaters.push({ x: x, y: y, txt: txt, color: color || '#ff5f96', life: 1 });
}

function drawHeart(x, y, s, c) {
  ctx.fillStyle = c;
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x, y, x - s * 0.55, y, x - s * 0.55, y + s * 0.35);
  ctx.bezierCurveTo(x - s * 0.55, y + s * 0.65, x, y + s * 0.85, x, y + s * 1.05);
  ctx.bezierCurveTo(x, y + s * 0.85, x + s * 0.55, y + s * 0.65, x + s * 0.55, y + s * 0.35);
  ctx.bezierCurveTo(x + s * 0.55, y, x, y, x, y + s * 0.35);
  ctx.fill();
}

function drawPaw(x, y, s, c, rot) {
  rot = rot || 0;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = c;
  ctx.beginPath(); ctx.ellipse(0, 3 * s, 6 * s, 5 * s, 0, 0, 7); ctx.fill();
  for (const [dx, dy] of [[-6, -4], [-2, -7], [2, -7], [6, -4]]) {
    ctx.beginPath(); ctx.ellipse(dx * s, dy * s, 2.4 * s, 3 * s, 0, 0, 7); ctx.fill();
  }
  ctx.restore();
}

function drawStar(x, y, s, c) {
  ctx.fillStyle = c;
  ctx.save(); ctx.translate(x, y);
  ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    ctx.rotate(Math.PI / 2);
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(s * 0.18, s * 0.18, 0, s);
    ctx.quadraticCurveTo(-s * 0.18, s * 0.18, 0, 0);
  }
  ctx.fill(); ctx.restore();
}

function drawCatPaddle(p, facing, bodyC, earInC) {
  const cx = p.x + PADDLE_W / 2;
  const wob = Math.sin(t * 0.1 + p.y * 0.05) * 1.2;
  const x = p.x, y = p.y + wob;
  const w = PADDLE_W, h = PADDLE_H;

  ctx.fillStyle = PAL.shadow;
  ctx.beginPath(); ctx.ellipse(cx, y + h + 8, w * 0.8, 5, 0, 0, 7); ctx.fill();

  ctx.strokeStyle = bodyC; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath();
  const tx = facing === 1 ? x - 4 : x + w + 4;
  ctx.moveTo(tx, y + h - 14);
  ctx.quadraticCurveTo(
    tx - facing * 12, y + h - 2 + Math.sin(t * 0.15) * 4,
    tx - facing * 8, y + h + 10 + Math.cos(t * 0.12) * 3
  );
  ctx.stroke();

  ctx.fillStyle = bodyC;
  ctx.beginPath();
  ctx.moveTo(x + 6, y + 14);
  ctx.arcTo(x + w, y + 14, x + w, y + h, 10);
  ctx.arcTo(x + w, y + h, x, y + h, 10);
  ctx.arcTo(x, y + h, x, y + 14, 10);
  ctx.arcTo(x, y + 14, x + w, y + 14, 10);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x + 2, y + 18); ctx.lineTo(x + 6, y + 2); ctx.lineTo(x + 12, y + 15); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x + w - 2, y + 18); ctx.lineTo(x + w - 6, y + 2); ctx.lineTo(x + w - 12, y + 15); ctx.fill();

  ctx.fillStyle = earInC;
  ctx.beginPath();
  ctx.moveTo(x + 4.5, y + 15); ctx.lineTo(x + 6.5, y + 7); ctx.lineTo(x + 9.5, y + 13.5); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x + w - 4.5, y + 15); ctx.lineTo(x + w - 6.5, y + 7); ctx.lineTo(x + w - 9.5, y + 13.5); ctx.fill();

  const fy = y + 26;
  ctx.fillStyle = PAL.ink;
  ctx.beginPath(); ctx.arc(x + 8, fy, 2.6, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x + w - 8, fy, 2.6, 0, 7); ctx.fill();

  drawHeart(cx, fy + 4, 4.5, '#ff7aa8');

  ctx.strokeStyle = PAL.ink; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - 4, fy + 10);
  ctx.quadraticCurveTo(cx - 2, fy + 12.5, cx, fy + 10);
  ctx.quadraticCurveTo(cx + 2, fy + 12.5, cx + 4, fy + 10);
  ctx.stroke();

  ctx.fillStyle = 'rgba(255,120,160,.45)';
  ctx.beginPath(); ctx.ellipse(x + 5.5, fy + 6, 3, 2, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + w - 5.5, fy + 6, 3, 2, 0, 0, 7); ctx.fill();
}

function drawBall() {
  const x = ball.x, y = ball.y, r = ball.r;
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = PAL.yarn;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();

  ctx.strokeStyle = PAL.yarnLine; ctx.lineWidth = 1.5;
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 0.9, r * (0.35 + Math.abs(i) * 0.18), i * 0.6, 0, 7);
    ctx.stroke();
  }
  ctx.restore();
}

function drawRat() {
  if (!rat.active) return;
  const x = rat.x, y = rat.y;
  const dir = rat.vx > 0 ? 1 : -1;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(dir, 1);
  ctx.fillStyle = '#b9aec9';
  ctx.beginPath(); ctx.ellipse(0, 2, 13, 9, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(10, -1, 8, 7, 0.2, 0, 7); ctx.fill();
  ctx.fillStyle = '#ff7aa8';
  ctx.beginPath(); ctx.arc(18, 0, 2, 0, 7); ctx.fill();
  ctx.restore();
}

// Complete Cat Face + Licking Churu Scene
function drawChuruScene() {
  if (!celebrate) return;
  const byPlayer = celebrate.byPlayer;
  const bodyC = byPlayer ? '#ffb84d' : '#a8a8b8';
  const earInC = byPlayer ? '#ffe0b3' : '#e0e0ea';
  const name = byPlayer ? '모모' : '나비';
  const ct = celebrate.t = (celebrate.t || 0) + 1;
  const pop = Math.min(1, ct / 10);

  // Background overlay
  ctx.fillStyle = 'rgba(60, 25, 60, 0.6)';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(W / 2, H / 2 + 10);
  ctx.scale(pop, pop);

  // Stars
  for (let i = 0; i < 6; i++) {
    const a = t * 0.04 + i * 1.05;
    drawStar(Math.cos(a) * 150, Math.sin(a) * 95, 6 + Math.sin(t * 0.2 + i) * 3, '#ffd76e');
  }

  const lick = Math.sin(t * 0.35);
  const bob = Math.sin(t * 0.12) * 3;
  const R = 55;

  // --- Cat Head ---
  ctx.save();
  ctx.translate(-30, bob);

  // Ears
  ctx.fillStyle = bodyC;
  ctx.beginPath();
  ctx.moveTo(-R * 0.85, -R * 0.5); ctx.lineTo(-R * 0.6, -R * 1.25); ctx.lineTo(-R * 0.2, -R * 0.8); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(R * 0.85, -R * 0.5); ctx.lineTo(R * 0.6, -R * 1.25); ctx.lineTo(R * 0.2, -R * 0.8); ctx.fill();
  ctx.fillStyle = earInC;
  ctx.beginPath();
  ctx.moveTo(-R * 0.68, -R * 0.62); ctx.lineTo(-R * 0.58, -R * 1.05); ctx.lineTo(-R * 0.34, -R * 0.74); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(R * 0.68, -R * 0.62); ctx.lineTo(R * 0.58, -R * 1.05); ctx.lineTo(R * 0.34, -R * 0.74); ctx.fill();

  // Head base
  ctx.fillStyle = bodyC;
  ctx.beginPath(); ctx.ellipse(0, 0, R, R * 0.88, 0, 0, 7); ctx.fill();

  // Happy closed eyes (＾ᴗ＾)
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.arc(s * R * 0.4, -R * 0.12, R * 0.18, Math.PI * 1.15, Math.PI * 1.85);
    ctx.stroke();
  }

  // Blush
  ctx.fillStyle = 'rgba(255, 120, 160, 0.5)';
  ctx.beginPath(); ctx.ellipse(-R * 0.55, R * 0.18, R * 0.16, R * 0.1, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(R * 0.55, R * 0.18, R * 0.16, R * 0.1, 0, 0, 7); ctx.fill();

  // Heart nose
  drawHeart(0, R * 0.08, 8, '#ff7aa8');

  // Whiskers
  ctx.lineWidth = 1.6;
  for (const s of [-1, 1]) {
    for (const dy of [-4, 4]) {
      ctx.beginPath();
      ctx.moveTo(s * R * 0.6, R * 0.2 + dy);
      ctx.lineTo(s * R * 1.05, R * 0.12 + dy * 1.8);
      ctx.stroke();
    }
  }

  // Mouth & Licking Tongue
  ctx.fillStyle = '#a04a6a';
  ctx.beginPath(); ctx.ellipse(6, R * 0.42, 11, 8 + lick * 2, 0.2, 0, 7); ctx.fill();
  ctx.fillStyle = '#ff9bb8';
  ctx.beginPath();
  ctx.ellipse(14 + lick * 10, R * 0.46, 12 + lick * 5, 6, 0.35, 0, 7);
  ctx.fill();

  ctx.restore(); // end cat head

  // --- Churu Tube ---
  ctx.save();
  ctx.translate(58, bob + 18 + lick * 3);
  ctx.rotate(-0.7 + lick * 0.06);

  ctx.fillStyle = '#8ed6c0';
  ctx.fillRect(-9, 0, 18, 62);

  ctx.fillStyle = '#fff';
  ctx.fillRect(-9, 18, 18, 26);
  ctx.fillStyle = '#ff6f9c';
  ctx.font = 'bold 10px monospace';
  ctx.textAlign = 'center';
  ctx.save(); 
  ctx.translate(0, 31); 
  ctx.rotate(Math.PI / 2);
  ctx.fillText('츄르', 0, 3);
  ctx.restore();

  ctx.fillStyle = PAL.cream;
  ctx.beginPath();
  ctx.moveTo(-5, 0);
  ctx.quadraticCurveTo(0, -14 - lick * 6, 5, 0);
  ctx.fill();

  ctx.fillStyle = '#6bbfa8';
  ctx.fillRect(-9, 58, 18, 4);

  ctx.restore(); // end churu tube
  ctx.restore(); // end pop scale

  // Texts
  ctx.textAlign = 'center';
  ctx.font = 'bold 32px "Courier New", monospace';
  ctx.fillStyle = 'rgba(124,63,102,.4)';
  ctx.fillText('★ 츄르 타임! ★', W / 2 + 2, 88 + 2);
  ctx.fillStyle = '#ffd76e';
  ctx.fillText('★ 츄르 타임! ★', W / 2, 88);

  ctx.font = 'bold 16px "Courier New", monospace';
  ctx.fillStyle = '#fff';
  const noms = ['냠냠', '냠냠냠', '할짝할짝', '쩝쩝'][(t / 20 | 0) % 4];
  ctx.fillText(`${name}: "${noms}…"`, W / 2, H - 56);
  ctx.font = 'bold 13px "Courier New", monospace';
  ctx.fillStyle = '#ffc7e3';
  ctx.fillText('득점 상품으로 츄르를 획득했습니다!', W / 2, H - 34);

  if (t % 8 === 0) {
    burstHearts(W / 2 + (Math.random() - 0.5) * 100, H / 2 - 40, 2, 1.5);
  }
}

function drawCourt() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, PAL.bg1); g.addColorStop(1, PAL.bg2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  bgPaws.forEach((p, i) => {
    drawPaw(p.x, p.y, p.s, 'rgba(255,143,191,.20)', p.a);
    drawStar(p.x + 30, p.y - 20, 5 + Math.sin(t * 0.05 + i) * 2, 'rgba(255,255,255,.5)');
  });

  ctx.strokeStyle = PAL.net; ctx.lineWidth = 4;
  ctx.strokeRect(6, 6, W - 12, H - 12);

  for (let yy = 20; yy < H - 10; yy += 34) {
    drawHeart(W / 2, yy, 9, 'rgba(255,120,170,.55)');
  }
}

function drawScore() {
  ctx.textAlign = 'center';
  ctx.font = 'bold 44px "Courier New", monospace';
  ctx.fillStyle = PAL.ink;
  ctx.fillText(player.score, W / 2 - 70, 58);
  ctx.fillText(cpu.score, W / 2 + 70, 58);

  ctx.font = 'bold 12px "Courier New", monospace';
  ctx.fillStyle = '#c76a9a';
  ctx.fillText('모모 ᓚᘏᗢ', W / 2 - 70, 76);
  ctx.fillText('ᗢᘏᓗ 나비', W / 2 + 70, 76);
}

function drawTitle() {
  drawCourt();
  const bob = Math.sin(t * 0.06) * 6;
  ctx.textAlign = 'center';
  ctx.font = 'bold 64px "Courier New", monospace';
  ctx.fillStyle = '#ff5f96';
  ctx.fillText('냥 퐁 !', W / 2, 168 + bob);

  ctx.font = 'bold 16px "Courier New", monospace';
  ctx.fillStyle = '#b05a88';
  ctx.fillText('～ N Y A N ★ P O N G ～', W / 2, 200 + bob);

  drawCatPaddle({ x: 90, y: 200, blink: 0 }, 1, '#ffb84d', '#ffe0b3');
  drawCatPaddle({ x: W - 90 - PADDLE_W, y: 200, blink: 0 }, -1, '#a8a8b8', '#e0e0ea');

  if ((t / 30 | 0) % 2 === 0) {
    ctx.font = 'bold 20px "Courier New", monospace';
    ctx.fillStyle = PAL.ink;
    ctx.fillText('▶ 화면을 터치하세요 ◀', W / 2, 350);
  }
}

function drawOver() {
  drawCourt();
  drawScore();
  ctx.textAlign = 'center';
  const isWin = winner === 'player';
  ctx.font = 'bold 50px "Courier New", monospace';
  ctx.fillStyle = isWin ? '#ff5f96' : '#8a7ba8';
  ctx.fillText(isWin ? '냥승리!' : '냥패배…', W / 2, H / 2 - 20);

  if ((t / 30 | 0) % 2 === 0) {
    ctx.font = 'bold 16px "Courier New", monospace';
    ctx.fillStyle = PAL.ink;
    ctx.fillText('▶ 화면을 터치해 다시 시작 ◀', W / 2, H / 2 + 60);
  }
}

function update() {
  t++;

  hearts = hearts.filter(h => (h.life -= 0.02) > 0);
  hearts.forEach(h => { h.x += h.vx; h.y += h.vy; h.vy += 0.06; });
  floaters = floaters.filter(f => (f.life -= 0.015) > 0);
  floaters.forEach(f => f.y -= 0.8);

  if (state === S.SCORE_PAUSE) {
    scorePauseT--;
    if (scorePauseT <= 0) {
      celebrate = null;
      if (player.score >= WIN_SCORE || cpu.score >= WIN_SCORE) {
        winner = player.score >= WIN_SCORE ? 'player' : 'cpu';
        state = S.OVER;
      } else {
        serveBall(player.scoredLast ? -1 : 1);
        state = S.PLAY;
      }
    }
    return;
  }

  if (state !== S.PLAY) return;

  if (targetY !== null) {
    player.y += (targetY - (player.y + PADDLE_H / 2)) * 0.22;
  }
  player.y = Math.max(10, Math.min(H - PADDLE_H - 10, player.y));

  const target = ball.vx > 0 ? ball.y : H / 2;
  const diff = target - (cpu.y + PADDLE_H / 2);
  cpu.y += Math.max(-3.5, Math.min(3.5, diff * 0.09));
  cpu.y = Math.max(10, Math.min(H - PADDLE_H - 10, cpu.y));

  ball.x += ball.vx;
  ball.y += ball.vy;

  if (ball.y - ball.r < 10) { ball.y = 10 + ball.r; ball.vy *= -1; bleep(520, 0.05); }
  if (ball.y + ball.r > H - 10) { ball.y = H - 10 - ball.r; ball.vy *= -1; bleep(520, 0.05); }

  function hitPaddle(p, dir) {
    if (ball.y + ball.r > p.y && ball.y - ball.r < p.y + PADDLE_H) {
      const edge = dir === 1 ? p.x + PADDLE_W : p.x;
      if (dir === 1 ? (ball.x - ball.r < edge && ball.x > p.x) : (ball.x + ball.r > edge && ball.x < p.x + PADDLE_W)) {
        ball.x = dir === 1 ? edge + ball.r : edge - ball.r;
        const rel = (ball.y - (p.y + PADDLE_H / 2)) / (PADDLE_H / 2);
        const speed = Math.min(9.5, Math.hypot(ball.vx, ball.vy) * 1.05 + 0.15);
        ball.vx = Math.cos(rel * 0.9) * speed * dir;
        ball.vy = Math.sin(rel * 0.9) * speed;
        bleep(dir === 1 ? 700 : 640, 0.06, 'square', 0.14, 120);
        return true;
      }
    }
    return false;
  }
  hitPaddle(player, 1) || hitPaddle(cpu, -1);

  if (ball.x < -20) {
    cpu.score++;
    player.scoredLast = false;
    afterScore(false);
  } else if (ball.x > W + 20) {
    player.score++;
    player.scoredLast = true;
    afterScore(true);
  }
}

function afterScore(byPlayer) {
  meow();
  celebrate = { byPlayer: byPlayer, t: 0 };
  scorePauseT = 140; // Full duration to show Churu time
  state = S.SCORE_PAUSE;
}

function render() {
  if (state === S.TITLE) {
    drawTitle();
  } else if (state === S.OVER) {
    drawOver();
  } else {
    drawCourt();
    drawScore();
    drawCatPaddle(player, 1, '#ffb84d', '#ffe0b3');
    drawCatPaddle(cpu, -1, '#a8a8b8', '#e0e0ea');
    if (state === S.PLAY) drawBall();
    if (state === S.SCORE_PAUSE && celebrate) drawChuruScene();
  }

  hearts.forEach(h => {
    ctx.globalAlpha = h.life;
    drawHeart(h.x, h.y, h.s, h.hue);
    ctx.globalAlpha = 1;
  });
  floaters.forEach(f => {
    ctx.globalAlpha = f.life;
    ctx.font = 'bold 18px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = f.color;
    ctx.fillText(f.txt, f.x, f.y);
    ctx.globalAlpha = 1;
  });
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}
loop();
})();
</script>
